server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: reglog-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  sql:
    init:
      mode: always
      continue-on-error: true

# Security / JWT Configuration
app:
  jwt:
    # 256-bit+ secure base64/hex secret for HMAC-SHA256
    secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
    expiration-ms: 86400000 # 24 hours
    reset-token-expiration-ms: 900000 # 15 minutes
  client:
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}

# Springdoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
